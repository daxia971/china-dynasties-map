<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国朝代更迭图鉴</title>
<style>
  :root{
    --ink:#2b2b25; --paper:#f7f4ec; --sea:#d6e6ef; --card:#fffdf7;
    --accent:#8c3b2e; --line:#d8d2c2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  header{padding:12px 24px 8px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{font-size:22px;letter-spacing:2px}
  header .sub{font-size:12px;color:#8a8470}
  nav{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  nav button{font-size:14px;padding:7px 16px;border:1px solid var(--line);background:#f1ecdf;border-radius:18px;cursor:pointer;color:#55503f;transition:.15s}
  nav button:hover{border-color:var(--accent);color:var(--accent)}
  nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold}
  /* 朝代时间轴 */
  #dynbar{display:flex;gap:3px;padding:8px 14px;background:#efe9da;border-bottom:1px solid var(--line);overflow-x:auto}
  #dynbar button{flex:1 1 0;min-width:44px;padding:5px 4px;border:1px solid rgba(0,0,0,.12);border-radius:7px;cursor:pointer;font-size:12.5px;line-height:1.25;color:#3c3528;background:#fff;transition:.15s;white-space:nowrap}
  #dynbar button small{display:block;font-size:9.5px;color:rgba(0,0,0,.45);transform:scale(.92)}
  #dynbar button:hover{filter:brightness(1.05);transform:translateY(-1px)}
  #dynbar button.on{color:#fff;font-weight:bold;border-color:rgba(0,0,0,.3);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  #dynbar button.on small{color:rgba(255,255,255,.8)}
  main{flex:1;display:flex;min-height:0}
  #mapWrap{flex:1;position:relative;background:var(--sea);overflow:hidden}
  #map{width:100%;height:100%;display:block}
  aside{width:350px;min-width:310px;border-left:1px solid var(--line);background:var(--card);padding:18px;overflow-y:auto}
  aside h2{font-size:17px;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  aside h2 .tag{font-size:11px;background:#efe6d8;color:#8a6a43;border-radius:4px;padding:2px 7px;font-weight:normal}
  aside .meta{margin:10px 0;border-top:1px dashed var(--line)}
  aside .meta div{display:flex;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  aside .meta b{width:92px;flex:none;color:#8a6a43;font-weight:normal}
  aside p{font-size:13.5px;line-height:1.85;margin-top:8px;text-align:justify}
  aside .hint{font-size:12px;color:#9a937e;margin-top:14px;line-height:1.7}
  aside ul.list{margin-top:10px;font-size:13px;line-height:1.6}
  aside ul.list li{list-style:none;padding:5px 8px;margin-bottom:4px;background:#f5f0e4;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  aside ul.list li:hover{background:#eee3cd}
  aside ul.list li span.v{color:#9a7c50;white-space:nowrap}
  /* 大事记列表 */
  .evts{margin-top:12px}
  .evts h3{font-size:13px;color:#8a6a43;margin-bottom:6px;border-left:3px solid var(--accent);padding-left:7px}
  .evt{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.8px;line-height:1.6}
  .evt .yr{flex:none;min-width:64px;color:#fff;background:#a98253;border-radius:4px;text-align:center;font-size:11px;height:fit-content;padding:2px 4px;margin-top:2px}
  .evt .tt b{color:#5d4423}
  .navbtns{display:flex;gap:8px;margin-top:14px}
  .navbtns button{flex:1;padding:7px;border:1px solid var(--line);background:#f1ecdf;border-radius:8px;cursor:pointer;font-size:13px;color:#55503f}
  .navbtns button:hover{border-color:var(--accent);color:var(--accent)}
  #tooltip{position:absolute;pointer-events:none;background:rgba(40,36,28,.92);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:6px;display:none;z-index:9;max-width:250px;line-height:1.5}
  #legend{position:absolute;left:14px;bottom:14px;background:rgba(255,253,247,.93);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:240px}
  #legend h4{font-size:12px;margin-bottom:6px;color:#6b6450}
  #legend .row{display:flex;align-items:center;gap:7px;margin:4px 0}
  #legend .sw{width:16px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.18);flex:none}
  #legend .ln{width:18px;height:0;border-top:3px solid #7a4a28;border-radius:2px;flex:none}
  #legend .dash{border-top:2px dashed #555}
  .prov{fill:#f0ebdd;stroke:#c5bda8;stroke-width:.6}
  .provline{fill:none;stroke:rgba(90,80,60,.35);stroke-width:.5;pointer-events:none}
  .shape{cursor:pointer;transition:filter .12s}
  .shape:hover{filter:brightness(1.07) saturate(1.12)}
  .shape.sel{stroke:#fff !important;stroke-width:2.4;filter:drop-shadow(0 0 5px rgba(0,0,0,.45));animation:selPulse 1.4s ease-in-out infinite}
  @keyframes selPulse{0%,100%{stroke-width:2.4}50%{stroke-width:5.5}}
  @keyframes lineGlow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
  .ripple{fill:none;pointer-events:none;animation:rippleOut .65s ease-out forwards}
  .ripple2{animation-delay:.12s;animation-duration:.75s}
  @keyframes rippleOut{0%{r:3;opacity:.95;stroke-width:4}100%{r:48;opacity:0;stroke-width:.5}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  aside.anim{animation:panelIn .32s ease}
  .realmLabel{font-weight:bold;fill:#3c3528;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.8);stroke-width:3.5}
  .capStar{cursor:pointer}
  .capLabel{font-size:11px;fill:#7a2d1f;font-weight:bold;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.88);stroke-width:3}
  .wallLine{fill:none;stroke:#8a5a2a;stroke-width:2.6;stroke-dasharray:2 4;stroke-linecap:round;pointer-events:none}
  .noteLabel{font-size:11px;fill:#6b5a3f;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:2.5}
  .evtMark{cursor:pointer}
  .evtLabel{font-size:10px;fill:#3c3528;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2.5}
  .chartBar{cursor:pointer}
  .chartBar:hover{filter:brightness(1.1)}
  .chartTxt{pointer-events:none;paint-order:stroke;stroke:rgba(247,244,236,.9);stroke-width:3}
  footer{font-size:11px;color:#a09a86;padding:6px 24px;border-top:1px solid var(--line);background:var(--card)}
  @media (max-width:860px){ main{flex-direction:column} aside{width:100%;border-left:none;border-top:1px solid var(--line);max-height:44vh} }
</style>
</head>

</header>
<div id="dynbar"></div>
<main>
  <div id="mapWrap">

/* ================================================== 渲染框架 ================================================== */
const svg = document.getElementById('map');
const tooltip = document.getElementById('tooltip');
const legend = document.getElementById('legend');
const panel = document.getElementById('panel');
const dynbar = document.getElementById('dynbar');
const NS = 'http://www.w3.org/2000/svg';
let mode = 'dyn', curDyn = 0;

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}

function buildBase(){
  const gProv = el('g', {id:'gProv'});
  CHINA_GEO.filter(f => f.name).forEach(f => {
    let d = '';
    f.polys.forEach(poly => d += pathOf(poly[0]));
    el('path', {d, class:'prov'}, gProv);
  });
  el('g', {id:'gOverlay'});
  const gTop = el('g', {id:'gTopProv'});
  CHINA_GEO.filter(f => f.name).forEach(f => {
    let d = '';
    f.polys.forEach(poly => d += pathOf(poly[0]));
    el('path', {d, class:'provline'}, gTop);
  });
  el('g', {id:'gMarks'});
  el('g', {id:'gFx'});
}
function overlay(){ return document.getElementById('gOverlay'); }
function marks(){ return document.getElementById('gMarks'); }
function clearLayers(){ overlay().innerHTML = ''; marks().innerHTML = ''; }

function showTip(ev, html){
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  const r = document.getElementById('mapWrap').getBoundingClientRect();
  let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 12;
  if(x > r.width - 260) x -= 280;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
}
function hideTip(){ tooltip.style.display = 'none'; }

function ripple(ev){
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const fx = document.getElementById('gFx');
  [['#fff','ripple'], ['#8c3b2e','ripple ripple2']].forEach(([color, cls]) => {
    const c = el('circle', {cx:p.x, cy:p.y, r:3, stroke:color, class:cls}, fx);
    setTimeout(() => c.remove(), 900);
  });
}

function animPanel(){
  panel.classList.remove('anim');
  void panel.offsetWidth;
  panel.classList.add('anim');
}

function select(elem, detail){
  document.querySelectorAll('.sel').forEach(s => s.classList.remove('sel'));
  if(elem){ elem.style.animation = ''; elem.classList.add('sel'); }
  showDetail(detail);
}

function showDetail(d){
  if(!d){ showIntro(); return; }
  animPanel();
  let html = '<h2>' + d.name + (d.tag ? ' <span class="tag">' + d.tag + '</span>' : '') + '</h2>';
  if(d.stats){
    html += '<div class="meta">';
    d.stats.forEach(s => html += '<div><b>' + s[0] + '</b><span>' + s[1] + '</span></div>');
    html += '</div>';
  }
  if(d.desc) html += '<p>' + d.desc + '</p>';
  html += '<div class="hint">↩ 点击地图空白处或切换维度可返回总览。</div>';
  panel.innerHTML = html;
}

function attach(elem, tipHTML, detail){
  elem.addEventListener('mousemove', ev => { ev.stopPropagation(); showTip(ev, tipHTML); });
  elem.addEventListener('mouseleave', hideTip);
  elem.addEventListener('click', ev => { ev.stopPropagation(); ripple(ev); select(ev.currentTarget, detail); });
}

/* ================================================== 维度一：朝代疆域 ================================================== */
function buildDynbar(){
  DYNS.forEach((d, i) => {
    const b = document.createElement('button');
    b.innerHTML = d.name + '<small>' + d.period.replace('约','') + '</small>';
    b.style.background = '#fff';
    b.onclick = () => { selectDyn(i); };
    b.dataset.i = i;
    dynbar.appendChild(b);
  });
}
function paintDynbar(){
  [...dynbar.children].forEach((b, i) => {
    const on = i === curDyn;
    b.classList.toggle('on', on);
    b.style.background = on ? DYNS[i].color : '#fff';
  });
}

function selectDyn(i){
  curDyn = (i + DYNS.length) % DYNS.length;
  clearLayers();
  drawDyn();
  paintDynbar();
  showDynPanel();
}

function drawDyn(){
  const d = DYNS[curDyn];
  const g = overlay(), m = marks();
  d.realms.forEach(r => {
    const p = el('path', {d:pathOf(r.poly), fill:r.color, 'fill-opacity':.52, stroke:r.color, 'stroke-width':1.6, class:'shape'}, g);
    attach(p, '<b>' + r.name + '</b><br>' + d.name + ' · ' + d.period, null);
    p.addEventListener('click', ev => { ev.stopPropagation(); ripple(ev); showDynPanel(); });
    const la = r.labelAt;
    const t = el('text', {x:PX(la[0]), y:PY(la[1]), class:'realmLabel', 'font-size': (r.poly.length > 25 ? 20 : 15)}, m);
    t.textContent = r.name.split('（')[0];
  });
  if(d.wall){
    el('path', {d:lineOf(d.wall), class:'wallLine'}, m);
    const wEnd = d.wall[1];
    const t = el('text', {x:PX(wEnd[0]), y:PY(wEnd[1]) - 8, class:'noteLabel'}, m);
    t.textContent = '🧱 长城';
  }
  d.caps.forEach(c => {
    const x = PX(c.lon), y = PY(c.lat);
    const gp = el('g', {class:'capStar'}, m);
    el('path', {d:starPath(x, y, 7), fill:'#d4a017', stroke:'#7a2d1f', 'stroke-width':1}, gp);
    const t = el('text', {x:x + 9, y:y + 4, class:'capLabel'}, gp);
    t.textContent = c.n.split('（')[0];
    attach(gp, '<b>★ ' + c.n + '</b><br>' + d.name + ' 都城', {name:'★ ' + c.n, tag:d.name + ' 都城', stats:[['朝代', d.name + '（' + d.period + '）']], desc:'（都城详情见"都城变迁"维度）'});
  });
  if(!d.realms.length){
    const t = el('text', {x:PX(104), y:PY(37), class:'realmLabel', 'font-size':'17'}, m);
    t.textContent = '疆域即今日中国版图（见底图）';
  }
  legend.innerHTML = '<h4>' + d.name + ' · ' + d.period + '</h4>'
    + d.realms.map(r => '<div class="row"><span class="sw" style="background:' + r.color + '"></span>' + r.name + '</div>').join('')
    + '<div class="row"><span style="color:#d4a017;font-size:13px">★</span>都城</div>'
    + (d.wall ? '<div class="row"><span class="ln dash" style="border-color:#8a5a2a"></span>长城（示意）</div>' : '')
    + '<div class="row" style="color:#8a8470">灰色细线为今日省界（参照）</div>';
}

function starPath(cx, cy, r){
  let d = '';
  for(let i = 0; i < 10; i++){
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = Math.PI / 5 * i - Math.PI / 2;
    d += (i === 0 ? 'M' : 'L') + (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}

function showDynPanel(){
  animPanel();
  const d = DYNS[curDyn];
  let html = '<h2>' + d.name + ' <span class="tag">' + d.period + '</span></h2>';
  html += '<div class="meta">';
  d.stats.forEach(s => html += '<div><b>' + s[0] + '</b><span>' + s[1] + '</span></div>');
  html += '</div><p>' + d.desc + '</p>';
  html += '<div class="evts"><h3>大事记</h3>';
  d.events.forEach(e => {
    html += '<div class="evt"><span class="yr">' + e.y + '</span><span class="tt"><b>' + e.t + '</b> — ' + e.n + '</span></div>';
  });
  html += '</div>';
  html += '<div class="navbtns"><button onclick="selectDyn(' + (curDyn - 1) + ')">← ' + DYNS[(curDyn - 1 + DYNS.length) % DYNS.length].name + '</button>'
        + '<button onclick="selectDyn(' + (curDyn + 1) + ')">' + DYNS[(curDyn + 1) % DYNS.length].name + ' →</button></div>';
  html += '<div class="hint">疆域为盛期约略示意；浅色区块为羁縻/都护府范围。</div>';
  panel.innerHTML = html;
}

/* ================================================== 维度二：关键事件 ================================================== */
function renderEvents(){
  const m = marks();
  const eraColor = Object.fromEntries(ERAS.map(e => [e.k, e.color]));
  EVENTS.forEach((e, i) => {
    const x = PX(e.lon), y = PY(e.lat);
    const gp = el('g', {class:'evtMark', 'data-evt':i}, m);
    el('circle', {cx:x, cy:y, r:6, fill:eraColor[e.era], stroke:'#fff', 'stroke-width':1.5}, gp);
    el('circle', {cx:x, cy:y, r:2.2, fill:'#fff'}, gp);
    const t = el('text', {x:x + 8, y:y + 3.5, class:'evtLabel'}, gp);
    t.textContent = e.n;
    attach(gp, '<b>' + e.n + '</b><br>' + e.y + ' · ' + e.era, {name:e.n, tag:e.y, stats:[['时代', e.era], ['年份', e.y]], desc:e.note});
  });
  legend.innerHTML = '<h4>时代图例</h4>' + ERAS.map(e =>
    '<div class="row"><span class="sw" style="background:' + e.color + ';border-radius:50%"></span>' + e.k + '</div>').join('');
}

/* ================================================== 维度三：都城变迁 ================================================== */
function renderCaps(){
  const m = marks();
  CAPITALS.forEach((c, i) => {
    const x = PX(c.lon), y = PY(c.lat);
    const gp = el('g', {class:'capStar', 'data-cap':i}, m);
    el('path', {d:starPath(x, y, c.big ? 9 : 6), fill:c.big ? '#c0392b' : '#d4a017', stroke:'#fff', 'stroke-width':1.2}, gp);
    const t = el('text', {x:x + (c.big ? 11 : 8), y:y + 4, class:'capLabel', 'font-size':c.big ? '12.5' : '10.5'}, gp);
    t.textContent = c.n.split('（')[0];
    attach(gp, '<b>★ ' + c.n + '</b><br>' + c.dyns, {name:'★ ' + c.n, tag:c.big ? '四大古都' : '古都', stats:[['建都朝代', c.dyns]], desc:c.note});
  });
  legend.innerHTML = '<h4>都城</h4>'
    + '<div class="row"><span style="color:#c0392b;font-size:14px">★</span>四大古都（西安·洛阳·北京·南京）</div>'
    + '<div class="row"><span style="color:#d4a017;font-size:12px">★</span>其他重要都城</div>'
    + '<div class="row" style="color:#8a8470">大势：长安/洛阳 → 开封 → 杭州/南京 → 北京</div>';
}

/* ================================================== 维度四：统一与分裂 ================================================== */
function renderUnity(){
  const m = marks();
  el('rect', {x:0, y:0, width:1000, height:730, fill:'#f7f4ec'}, m);
  const X = yr => 30 + (yr + 230) / (1912 + 230) * 940;
  let t = el('text', {x:500, y:60, 'text-anchor':'middle', 'font-size':'20', fill:'#5d4423', 'font-weight':'bold'}, m);
  t.textContent = '两千一百年的分与合（前221 – 1912）';
  // 主时间条
  UNITY.forEach((u, i) => {
    const x1 = X(u.s), x2 = X(u.e);
    const r = el('rect', {x:x1, y:150, width:(x2 - x1), height:64, fill:UNITY_COLORS[u.t], stroke:'#fff', 'stroke-width':1, class:'chartBar', rx:3}, m);
    const yrs = u.e - u.s;
    attach(r, '<b>' + u.n + '</b><br>' + fmtYear(u.s) + ' – ' + fmtYear(u.e) + '（' + yrs + '年）<br>' + UNITY_NAMES[u.t],
      {name:u.n, tag:UNITY_NAMES[u.t], stats:[['起止', fmtYear(u.s) + ' – ' + fmtYear(u.e)], ['时长', yrs + ' 年'], ['状态', UNITY_NAMES[u.t]]],
       desc:unityDesc(u)});
    if(x2 - x1 > 26){
      const lbl = el('text', {x:(x1 + x2) / 2, y:(i % 2 ? 140 : 236), 'text-anchor':'middle', 'font-size':'12', fill:'#3c3528', class:'chartTxt'}, m);
      lbl.textContent = u.n;
      el('line', {x1:(x1 + x2) / 2, y1:(i % 2 ? 143 : 214), x2:(x1 + x2) / 2, y2:(i % 2 ? 150 : 226), stroke:'#999', 'stroke-width':.7}, m);
    }
  });
  // 刻度
  [-200, 0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800].forEach(yr => {
    el('line', {x1:X(yr), y1:214, x2:X(yr), y2:258, stroke:'#c5bda8', 'stroke-width':.7}, m);
    const tt = el('text', {x:X(yr), y:272, 'text-anchor':'middle', 'font-size':'10.5', fill:'#8a8470'}, m);
    tt.textContent = fmtYear(yr);
  });
  // 国祚排行
  t = el('text', {x:500, y:330, 'text-anchor':'middle', 'font-size':'16', fill:'#5d4423', 'font-weight':'bold'}, m);
  t.textContent = '王朝国祚排行（年）';
  const maxDur = DURATIONS[0][1];
  DURATIONS.forEach((d, i) => {
    const y = 352 + i * 27, w = d[1] / maxDur * 560;
    const bar = el('rect', {x:260, y:y, width:w, height:18, fill: i < 3 ? '#b08a3e' : '#a98253', 'fill-opacity': .85, rx:3, class:'chartBar'}, m);
    attach(bar, '<b>' + d[0] + '</b>：' + d[1] + ' 年', {name:d[0], tag:d[1] + ' 年', stats:[['国祚', d[1] + ' 年']], desc:d[0].includes('夏') || d[0].includes('商') || d[0].includes('周') ? '先秦三代的年数含传说与推算成分（夏商周断代工程口径），仅供对比参考。' : '自建立至灭亡的延续时间，含中衰与中兴。'});
    const n = el('text', {x:252, y:y + 13.5, 'text-anchor':'end', 'font-size':'12', fill:'#3c3528'}, m);
    n.textContent = d[0];
    const v = el('text', {x:260 + w + 6, y:y + 13.5, 'font-size':'11', fill:'#8a6a43'}, m);
    v.textContent = d[1];
  });
  legend.innerHTML = '<h4>状态</h4>' + Object.keys(UNITY_COLORS).map(k =>
    '<div class="row"><span class="sw" style="background:' + UNITY_COLORS[k] + '"></span>' + UNITY_NAMES[k] + '</div>').join('');
}
function fmtYear(y){ return y < 0 ? '前' + (-y) : String(y); }
function unityDesc(u){
  if(u.t === 'u') return '中央政权有效统治全国主要农耕区的大一统时期。';
  if(u.t === 'm') return '两个以上成熟政权长期并立、以条约或默契维持边界的时期——它们彼此都认为自己才是正统。';
  return '多个政权混战、更替频繁的分裂时期，也往往是人口锐减、同时酝酿着制度创新的时期。';
}

/* ================================================== 总览面板 ================================================== */
function showIntro(){
  animPanel();
  if(mode === 'dyn'){
    showDynPanel();
  } else if(mode === 'events'){
    let list = '<ul class="list">' + EVENTS.map((e, i) =>
      '<li onclick="pickEvt(' + i + ')"><span>' + e.n + '</span><span class="v">' + e.y + '</span></li>').join('') + '</ul>';
    panel.innerHTML = '<h2>关键事件节点</h2><p>26 个改变中国历史走向的时刻，按发生地点落在地图上，颜色代表时代。有的是一战定乾坤（牧野、赤壁、崖山），有的是一纸改格局（澶渊之盟、尼布楚条约），有的是一声枪响换人间（武昌起义）。点击地图圆点或下方列表查看来龙去脉。</p>' + list;
  } else if(mode === 'caps'){
    let list = '<ul class="list">' + CAPITALS.map((c, i) =>
      '<li onclick="pickCap(' + i + ')"><span>' + (c.big ? '★ ' : '') + c.n + '</span><span class="v">' + c.dyns.split('·')[0] + '…</span></li>').join('') + '</ul>';
    panel.innerHTML = '<h2>都城变迁</h2><p>都城在哪儿，是每个王朝算的一笔大账：关中的险、洛阳的中、开封的漕运、北京的边防。总趋势是<b>先东西移动（长安⇄洛阳），再向东（开封）、向南（杭州/南京）、最后定于北（北京）</b>——背后是经济重心南移与边防重心北移的拉锯。点击星标看每座古都的故事。</p>' + list;
  } else {
    const total = 1912 + 221;
    const uy = UNITY.filter(x => x.t === 'u').reduce((s, x) => s + x.e - x.s, 0);
    const my = UNITY.filter(x => x.t === 'm').reduce((s, x) => s + x.e - x.s, 0);
    const sy = total - uy - my;
    panel.innerHTML = '<h2>统一与分裂</h2><p>自秦统一（前221）到清帝退位（1912）共 ' + total + ' 年，其中<b>大一统约 ' + uy + ' 年</b>、南北并立约 ' + my + ' 年、群雄割据约 ' + sy + ' 年——"合"确实是主旋律，但"分"占了约三分之一的时间。最长的分裂（魏晋南北朝）持续近三百年，而正是那段时期完成了民族大融合与江南大开发。</p>'
    + '<p>下方第二张图是王朝国祚排行：两汉 422 年最长寿（大一统王朝中），秦、隋这两个"制度奠基者"却都只有十几到三十几年——<b>打天下的制度未必坐得了天下，但好制度会被下一个王朝完整继承</b>。</p>'
    + '<div class="hint">点击图中色块查看每个时期详情。先秦三代（夏商周）为封建邦国时代，不计入统一/分裂统计。</div>';
  }
}
window.pickEvt = i => { const e = EVENTS[i]; select(document.querySelector('[data-evt="' + i + '"]'), {name:e.n, tag:e.y, stats:[['时代', e.era], ['年份', e.y]], desc:e.note}); };
window.pickCap = i => { const c = CAPITALS[i]; select(document.querySelector('[data-cap="' + i + '"]'), {name:'★ ' + c.n, tag:c.big ? '四大古都' : '古都', stats:[['建都朝代', c.dyns]], desc:c.note}); };

/* ================================================== 模式切换 ================================================== */
const MODES = [
  {id:'dyn', label:'朝代疆域', fn:() => { drawDyn(); paintDynbar(); }},
  {id:'events', label:'关键事件', fn:renderEvents},
  {id:'caps', label:'都城变迁', fn:renderCaps},
  {id:'unity', label:'统一与分裂', fn:renderUnity}
];
const tabs = document.getElementById('tabs');
MODES.forEach(mo => {
  const b = document.createElement('button');
  b.textContent = mo.label;
  b.onclick = () => setMode(mo.id);
  b.dataset.mode = mo.id;
  tabs.appendChild(b);
});
function setMode(id){
  mode = id;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.mode === id));
  dynbar.style.display = id === 'dyn' ? 'flex' : 'none';
  clearLayers();
  MODES.find(mo => mo.id === id).fn();
  let i = 0;
  [overlay(), marks()].forEach(gr => {
    for(const ch of gr.children){
      const delay = Math.min(i * 14, 550);
      ch.style.animation = 'fadeIn .4s ease ' + delay + 'ms both';
      ch.addEventListener('animationend', () => { ch.style.animation = ''; }, {once:true});
      setTimeout(() => { ch.style.animation = ''; }, delay + 800);
      i++;
    }
  });
  showIntro();
}
svg.addEventListener('click', () => { if(mode !== 'dyn') select(null, null); });

buildBase();
buildDynbar();
setMode('dyn');
</script>
